# Trae las mejoras de la plantilla (sitio-base) sin tocar el contenido del cliente.
# Uso: pestaña "Actions" → "Actualizar desde la plantilla" → "Run workflow".
name: Actualizar desde la plantilla

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PLANTILLA: https://github.com/edukaos/sitio-base.git

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar diseño y sistema de la plantilla
        run: |
          git remote add plantilla "$PLANTILLA"
          git fetch --depth=1 plantilla main
          # Todo menos el contenido del cliente, sus fotos y su README
          git checkout plantilla/main -- . ':!src/content' ':!public/images' ':!README.md'
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar desde la plantilla" || echo "Ya estaba al día"
          git push
